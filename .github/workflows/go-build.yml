name: Go Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BINARY_FILENAME: "ce-arc-server"
  PACKAGES_DIR: "./server"
  GO_VERSION: "1.25.4"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./server/...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 35)}"; then
            echo "Coverage ${COVERAGE}% is below the 35% threshold"
            exit 1
          fi

      - name: Build binary
        run: go build -o "${{ env.BINARY_FILENAME }}" "${{ env.PACKAGES_DIR }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag version
        id: set-tag
        run: |
          tag="${{ github.sha }}"
          echo "image_tag=${tag:0:8}" >> "$GITHUB_OUTPUT"

      - name: Push container image
        uses: ./.github/actions/publish-container-image
        with:
          registry: ${{ secrets.CT_REGISTRY }}
          image_name: "gh-runner"
          image_tags: "${{ steps.set-tag.outputs.image_tag }}"
          username: ${{ secrets.CT_REGISTRY_USERNAME }}
          password: ${{ secrets.CT_REGISTRY_PASSWORD }}
          context: ./runner
          containerfile: ./runner/runner-ubuntu.containerfile

  publish-server-image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag version
        id: set-tag
        run: |
          tag="${{ github.sha }}"
          echo "image_tag=${tag:0:8}" >> "$GITHUB_OUTPUT"

      - name: Push server image to ghcr.io
        uses: ./.github/actions/publish-container-image
        with:
          registry: ghcr.io
          namespace: ${{ github.repository_owner }}
          image_name: "ce-arc-server"
          image_tags: "${{ steps.set-tag.outputs.image_tag }}"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          containerfile: ./Dockerfile
